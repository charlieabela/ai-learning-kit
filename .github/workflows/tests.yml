name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The kit, every session and every notebook, on the systems students use.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    env:
      AILK_ONLINE: "1"        # download every registered dataset from its owner and check its checksum
      AILK_EXECUTE: "1"       # execute every notebook named by a session
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,graphs,xml]"
      - name: Validate problems, sessions and notebooks
        run: python -m ai_learning_kit.dev.validate
      - name: Tests (datasets from their owners, notebooks executed)
        run: python -m pytest -q -rs --junitxml=junit.xml
      - name: Report failures as annotations
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  text = (bad.get("message") or "") + " | " + (bad.text or "")[-900:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
