[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-kit"
dynamic = ["version"]
description = "A sandbox library of problems, sessions and formative feedback for the AI study units at the University of Malta"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Charlie Abela" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pandas>=2.0",
    "numpy",
    "matplotlib",
    "openpyxl",
    "python-docx>=1.0",
    "pypdf>=3.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "scipy>=1.9",            # pandas needs it for .corr(method="spearman")
]

[project.optional-dependencies]
# Tiers by what each needs to install (teaching depth is set per session, not here).
graphs = ["networkx>=3.2", "scikit-learn>=1.3"]
advanced = ["networkx>=3.2", "scikit-learn>=1.3", "torch>=2.2", "torch_geometric>=2.5", "neo4j>=5.14", "rdflib>=7.0", "owlrl>=6.0"]
xml = ["lxml"]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
include = ["ai_learning_kit*"]

[tool.setuptools.package-data]
ai_learning_kit = ["problems/*/data/*", "units/*/*/reference/*", "units/*/*/site/*", "units/*/*/saved/*",
                   "units/*/*/data/*",
                   "datasets/small_data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "ai_learning_kit._version.__version__" }
