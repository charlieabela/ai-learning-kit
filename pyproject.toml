[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-kit"
dynamic = ["version"]
description = "A sandbox library of problems, sessions and formative feedback for the AI study units at the University of Malta"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Charlie Abela" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pandas>=1.5",
    "numpy",
    "matplotlib",
    "openpyxl",
    "python-docx>=1.0",
    "pypdf>=3.0",
]

[project.optional-dependencies]
xml = ["lxml"]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
include = ["ai_learning_kit*", "ari1101kit*"]

[tool.setuptools.package-data]
ai_learning_kit = ["problems/*/data/*"]

[tool.setuptools.dynamic]
version = { attr = "ai_learning_kit._version.__version__" }
